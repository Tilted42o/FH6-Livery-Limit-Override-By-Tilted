name: Build Layer Limit Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "LayerLimitOverride.profiles.json"
      - "docs/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build Windows EXE
        working-directory: src
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "../Layer Limit Override v2 - By Tilted42o.exe" .

      - name: Build complete release ZIP
        shell: pwsh
        run: |
          $release = "Layer Limit Override v2.0.0-beta4 - By Tilted42o"
          Remove-Item $release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $release | Out-Null

          Copy-Item "Layer Limit Override v2 - By Tilted42o.exe" $release
          Copy-Item "LayerLimitOverride.profiles.json" $release
          Copy-Item "docs/INSTALL.txt" "$release/README_FIRST.txt"
          Copy-Item "docs/PROFILE_FORMAT.md" $release
          Copy-Item "docs/TEST_RESULTS.txt" $release
          Copy-Item -Recurse "src" "$release/Source"

          $hash = (Get-FileHash "$release/Layer Limit Override v2 - By Tilted42o.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Layer Limit Override v2 - By Tilted42o.exe" | Set-Content "$release/SHA256.txt"

          Compress-Archive -Path $release -DestinationPath "Layer-Limit-Override-v2.0.0-beta4-By-Tilted42o.zip" -Force

      - name: Upload complete release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Layer-Limit-Override-v2.0.0-beta4-By-Tilted42o
          path: Layer-Limit-Override-v2.0.0-beta4-By-Tilted42o.zip
          if-no-files-found: error
