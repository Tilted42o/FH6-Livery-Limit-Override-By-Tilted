name: Build Layer Limit Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "LayerLimitOverride.profiles.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build Windows EXE
        working-directory: src
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "../Layer-Limit-Override-v2-By-Tilted42o.exe" .

      - name: Build download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item "Layer-Limit-Override-v2-By-Tilted42o.exe" "downloads/Layer-Limit-Override-v2-By-Tilted42o.exe" -Force

          $stage = "Layer Limit Override v2.0.0-beta4 - By Tilted42o"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item "Layer-Limit-Override-v2-By-Tilted42o.exe" "$stage/Layer Limit Override v2 - By Tilted42o.exe"
          Copy-Item "LayerLimitOverride.profiles.json" $stage
          Copy-Item "docs/INSTALL.txt" "$stage/README_FIRST.txt"
          Copy-Item "docs/PROFILE_FORMAT.md" $stage
          Copy-Item "docs/TEST_RESULTS.txt" $stage
          Copy-Item -Recurse "src" "$stage/Source"

          $hash = (Get-FileHash "$stage/Layer Limit Override v2 - By Tilted42o.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Layer Limit Override v2 - By Tilted42o.exe" | Set-Content "$stage/SHA256.txt"

          Compress-Archive -Path $stage -DestinationPath "downloads/Layer-Limit-Override-v2.0.0-beta4-By-Tilted42o.zip" -Force

      - name: Publish downloads to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if (git diff --cached --quiet) {
            Write-Host "Downloads are already current."
          } else {
            git commit -m "Publish beta4 downloads [skip ci]"
            git push
          }
